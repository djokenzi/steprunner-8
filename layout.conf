# StepRunner-8 MPC skin layout (Force Shadow widget syntax, tools/shadow_skin.py). Browser renderer (vst.json "art": "html"),
# needed for the TRIGS cells: a picture per cell (images/cell_<state>.png, gen_cell_imgs.py) under a see-through toggle.
# The 16 step buttons, the lock knobs and the track knobs are a window on the pattern: TRACK and PAGE pick
# which 16 steps are shown, the last tapped step (or EDIT STEP) picks the step the lock knobs edit.

theme_accent=f0a020
theme_bg=141414

[tab PROGRAM]
# Frame titles are separate text lines so they can change colour with the mode (when=ptitle:...): NORMAL f0a020,
# EDIT (STEP EDIT) 19b3c6, TRACK (TRACK EDIT) a064e8, EUCLID (EUCLIDIAN) 58c24f. gen_cell_imgs.py uses the same colours.
frame x=516 y=140 w=740 h=335 title=""
# The panel has three contents (read-only parameter "panel") and three titles ("ptitle"); the plugin sets both.
# v2.1.0: the right-hand titles follow the panel (EUCLIDIAN leaves the right part as it was)
