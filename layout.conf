# TRIGS: 16 cells in one row. Each is a picture (cellN) under a see-through BUTTON bound to stepN. It has to be a
# button, not a toggle: tools/shadow_skin.py gives an image toggle a touch box max(120, w+10) wide, so toggles 74 px
