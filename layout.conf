# Left: PERFORM ALL, COMMIT (the PERFORM undo button is gone: UNDO on the PROGRAM tab covers it). Right: eight knobs named like the step locks: while PERFORM ALL is on each one offsets
# that lock on all 8 tracks at once. While it is off the knobs are hidden and a message is shown (like MULTI on STEPS).
# Switching PERFORM ALL off without COMMIT restores everything as it was when it was switched on.
